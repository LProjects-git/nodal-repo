name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Générer le graphe de démonstration
        run: python -m nodal demo.py -o /tmp/graph.html
      - name: Vérifier l'auto-analyse
        run: python -m nodal nodal/analyzer.py -o /tmp/self.html
