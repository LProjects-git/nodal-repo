name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Démo Python
        run: python -m nodal demo.py -o /tmp/py.html
      - name: Démo C++
        run: python -m nodal demo.cpp -o /tmp/cpp.html
      - name: Auto-analyse (projet complet)
        run: python -m nodal . --ignore=demo.py -o /tmp/self.html
      - name: Projet stdlib
        run: python -m nodal "$(python -c 'import json,os;print(os.path.dirname(json.__file__))')" -o /tmp/std.html
      - name: Erreurs attendues
        run: |
          ! python -m nodal absent.py 2>/dev/null
          ! python -m nodal README.md -o /tmp/x.html 2>/dev/null
