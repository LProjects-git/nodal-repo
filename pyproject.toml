[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodal"
version = "3.1.0"
description = "Graphe d'appels interactif façon éditeur de nœuds Blender pour un fichier ou un projet Python / C++"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ast", "call-graph", "visualization", "static-analysis", "cpp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
clang = ["libclang>=16"]

[project.scripts]
nodal = "nodal.__main__:main"

[project.urls]
Source = "https://github.com/USER/nodal"

[tool.hatch.build.targets.wheel]
packages = ["nodal"]
